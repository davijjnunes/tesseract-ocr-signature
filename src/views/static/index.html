<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./style.css?v=3">
	<title>Verificação de assinatura</title>
	<script src="./main.js?v=3" defer></script>
</head>
<body>

    <header>
        <h1>Enviar Imagem</h1>
    </header>

    <div>
        <main>
            <form id="form">
                <input type="file" id="image" accept="image/png, image/jpeg, image/webp" required>
                <img id="preview" alt="Prévia da imagem" hidden>
                <button type="submit">Enviar</button>
            </form>

            <p id="status"></p>
        </main>
    </div>

</body>
</html>
