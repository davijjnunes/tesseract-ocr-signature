[project]
name = "apps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "imutils>=0.5.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ocrmypdf>=17.14.1",
    "ollama>=0.6.3",
    "openai>=3.51.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
